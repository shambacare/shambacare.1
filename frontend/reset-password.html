<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Reset Password - ShambaCare Kenya</title>
    <meta name="description" content="Reset your ShambaCare password using the 6-digit code sent to your email.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        agri: {
                            green: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac', 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d', 950: '#052e16' },
                            blue: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e', 950: '#082f49' }
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        .background-slideshow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; background-repeat: no-repeat; opacity: 0; transition: opacity 1.5s ease-in-out; animation: kenBurns 20s ease-in-out infinite alternate; }
        .slide.active { opacity: 1; }
        @keyframes kenBurns { 0% { transform: scale(1) translateX(0); } 100% { transform: scale(1.1) translateX(-2%); } }
        .background-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.8) 100%); z-index: -1; }
        
        body { margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f8fafc; }
        .dark body { background-color: #06140e; }

        .reset-card {
            background: white;
            border-radius: 2rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            margin: 1rem;
            border: 1px solid #e5e7eb;
            color: #1e293b;
            text-align: center;
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            animation: fadeInUp 0.6s ease-out;
        }
        .dark .reset-card {
            background: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .gradient-text { background: linear-gradient(135deg, #22c55e 0%, #0ea5e9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        
        h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; color: #1e293b; }
        .dark h1 { color: #f1f5f9; }
        p { color: #64748b; margin-bottom: 1.5rem; }
        .dark p { color: #94a3b8; }

        .input-group { position: relative; margin-bottom: 1.25rem; }
        input {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            border-radius: 0.75rem;
            padding: 0.875rem 1rem;
            width: 100%;
            transition: all 0.3s;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .dark input {
            background: #0f172a;
            border-color: #334155;
            color: #f1f5f9;
        }
        input:focus {
            outline: none;
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22,163,74,0.1);
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
        }
        
        button {
            background: linear-gradient(135deg, #16a34a 0%, #0284c7 100%);
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0.875rem;
            width: 100%;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(22,163,74,0.3);
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 16px;
            background: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease-out;
        }
        .toast.error { background: #ef4444; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .strength-meter { height: 6px; background: #e2e8f0; border-radius: 3px; margin-top: -0.75rem; margin-bottom: 1.25rem; overflow: hidden; }
        .dark .strength-meter { background: #334155; }
        .strength-fill { width: 0%; height: 100%; transition: width 0.3s ease; }
        .strength-fill.weak { background: #ef4444; width: 33%; }
        .strength-fill.medium { background: #f59e0b; width: 66%; }
        .strength-fill.strong { background: #10b981; width: 100%; }
        
        .code-input { letter-spacing: 8px; font-size: 1.5rem; text-align: center; font-weight: 700; color: #16a34a; }
        .dark .code-input { color: #4ade80; }

        .step-indicator { display: flex; justify-content: center; gap: 0.75rem; margin-bottom: 2rem; }
        .step-dot { width: 12px; height: 12px; border-radius: 50%; background: #e2e8f0; transition: all 0.3s; }
        .dark .step-dot { background: #334155; }
        .step-dot.active { background: #16a34a; transform: scale(1.2); }
        .step-dot.done { background: #10b981; }

        .hidden-step { display: none; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .float-animation { animation: float 3s ease-in-out infinite; }
    </style>
    
</head>
<body>
    <div class="background-slideshow">
        <div class="slide" style="background-image: url('coffee1.jpg')"></div>
        <div class="slide" style="background-image: url('maize1.0.jpg')"></div>
        <div class="slide" style="background-image: url('passion1.jpg')"></div>
        <div class="slide" style="background-image: url('havest.jpg')"></div>
    </div>
    <div class="background-overlay"></div>

    <div class="reset-card">
        <i class="fas fa-leaf text-4xl text-agri-green-600 mb-3 float-animation"></i>
        
        <!-- Step indicators -->
        <div class="step-indicator">
            <span class="step-dot active" id="stepDot1"></span>
            <span class="step-dot" id="stepDot2"></span>
        </div>

        <h1 id="stepTitle">Verify Code</h1>
        <p id="stepDescription">Enter the 6-digit code sent to your email.</p>

        <!-- Step 1: Verify Code -->
        <div id="step1">
            <div class="input-group">
                <input type="email" id="resetEmail" placeholder="Email address" value="">
            </div>
            <div class="input-group">
                <input type="text" id="resetCode" placeholder="6-digit code" maxlength="6" class="code-input">
            </div>
            <button id="verifyBtn">Verify Code</button>
            
        </div>

        <!-- Step 2: Set New Password -->
        <div id="step2" class="hidden-step">
            <p>Code verified! Now set your new password.</p>
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="New password (min. 6 characters)">
                <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <div class="strength-meter">
                <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="strength-text" id="strengthText"></div>
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
                <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <button id="resetBtn">Reset Password</button>
            
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const API_URL = 'https://shambacare-1.onrender.com/api';
        let verifiedEmail = '';
        let verifiedCode = '';

        // ==================== BACKGROUND SLIDESHOW ====================
        class BackgroundSlideshow {
            constructor(slides, interval = 8000) {
                this.slides = slides;
                this.currentIndex = 0;
                this.interval = interval;
            }
            init() {
                if (this.slides.length) {
                    this.slides[0].classList.add('active');
                    setInterval(() => {
                        this.slides[this.currentIndex].classList.remove('active');
                        this.currentIndex = (this.currentIndex + 1) % this.slides.length;
                        this.slides[this.currentIndex].classList.add('active');
                    }, this.interval);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const slides = document.querySelectorAll('.slide');
            if (slides.length) {
                const slideshow = new BackgroundSlideshow(slides, 8000);
                slideshow.init();
            }
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
            }
            // Pre-fill email from URL param
            const urlParams = new URLSearchParams(window.location.search);
            const emailFromUrl = urlParams.get('email');
            if (emailFromUrl) {
                document.getElementById('resetEmail').value = emailFromUrl;
            }
        });

        // ==================== TOAST ====================
        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ==================== PASSWORD TOGGLE ====================
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // ==================== PASSWORD STRENGTH ====================
        const newPasswordInput = document.getElementById('newPassword');
        if (newPasswordInput) {
            newPasswordInput.addEventListener('input', function(e) {
                const pwd = e.target.value;
                const fill = document.getElementById('strengthFill');
                const text = document.getElementById('strengthText');
                if (!pwd) {
                    fill.className = 'strength-fill';
                    fill.style.width = '0%';
                    text.innerHTML = '';
                    return;
                }
                let strength = 0;
                if (pwd.length >= 6) strength++;
                if (pwd.length >= 10) strength++;
                if (/[A-Z]/.test(pwd)) strength++;
                if (/[0-9]/.test(pwd)) strength++;
                if (/[^A-Za-z0-9]/.test(pwd)) strength++;
                fill.className = 'strength-fill';
                if (strength <= 2) {
                    fill.classList.add('weak');
                    text.innerHTML = 'Weak password';
                    text.style.color = '#fca5a5';
                } else if (strength <= 4) {
                    fill.classList.add('medium');
                    text.innerHTML = 'Medium password';
                    text.style.color = '#fcd34d';
                } else {
                    fill.classList.add('strong');
                    text.innerHTML = 'Strong password';
                    text.style.color = '#6ee7b7';
                }
            });
        }

        // ==================== STEP 1 – VERIFY CODE ====================
        document.getElementById('verifyBtn').addEventListener('click', async function() {
            const email = document.getElementById('resetEmail').value.trim();
            const code = document.getElementById('resetCode').value.trim();

            if (!email || !code) {
                showToast('Please enter email and code', true);
                return;
            }
            if (code.length !== 6 || !/^\d{6}$/.test(code)) {
                showToast('Please enter a valid 6-digit code', true);
                return;
            }

            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loader"></span> Verifying...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/verify-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });
                const data = await response.json();
                if (data.success) {
                    verifiedEmail = email;
                    verifiedCode = code;
                    // Switch to step 2
                    document.getElementById('step1').classList.add('hidden-step');
                    document.getElementById('step2').classList.remove('hidden-step');
                    document.getElementById('stepTitle').textContent = 'Set New Password';
                    document.getElementById('stepDescription').textContent = 'Choose a strong password.';
                    document.getElementById('stepDot1').classList.remove('active');
                    document.getElementById('stepDot1').classList.add('done');
                    document.getElementById('stepDot2').classList.add('active');
                    showToast('Code verified! Enter your new password.');
                } else {
                    showToast(data.message || 'Verification failed', true);
                }
            } catch (error) {
                console.error(error);
                showToast('Network error. Please try again.', true);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // ==================== STEP 2 – RESET PASSWORD ====================
        document.getElementById('resetBtn').addEventListener('click', async function() {
            const email = verifiedEmail;
            const code = verifiedCode;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword || !confirmPassword) {
                showToast('Please fill in both password fields', true);
                return;
            }
            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match', true);
                return;
            }
            if (newPassword.length < 6) {
                showToast('Password must be at least 6 characters', true);
                return;
            }

            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loader"></span> Resetting...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, newPassword })
                });
                const data = await response.json();
                if (data.success) {
                    showToast('✅ Password reset successful! Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showToast(data.message || 'Reset failed', true);
                }
            } catch (error) {
                console.error(error);
                showToast('Network error. Please try again.', true);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // ==================== ENTER KEY SUPPORT ====================
        document.getElementById('resetCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('verifyBtn').click();
        });
        document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('resetBtn').click();
        });
    </script>
</body>
</html>
